name: Build LifeOSAI Android APK (Pages production v2)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-twa-pages-production-v2.yml"
      - "apps/android-twa/**"
      - "web/lifeos_voice/.well-known/assetlinks.json"
      - "web/lifeos_voice/manifest.webmanifest"

permissions:
  contents: read

concurrency:
  group: lifeosai-android-pages-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and sign production Pages TWA v2
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PACKAGE_ID: losia.htc.com
      KEY_ALIAS: losai-upload
      KEYSTORE_PATH: /tmp/losai-upload.jks
      BUBBLEWRAP_ANDROID_SDK: /tmp/losai-bubblewrap-android-sdk

    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is missing}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "build-tools;34.0.0"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          echo "ANDROID_BUILD_ENVIRONMENT=PASS"

      - name: Validate production Pages contract
        shell: bash
        working-directory: apps/android-twa
        run: |
          set -Eeuo pipefail
          python scripts/validate_wrapper.py .
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("twa-manifest.json").read_text(encoding="utf-8"))
          assetlinks = json.loads(Path("../../web/lifeos_voice/.well-known/assetlinks.json").read_text(encoding="utf-8"))
          assert manifest["host"] == "lifeosai.pages.dev"
          assert manifest["startUrl"] == "/chat?source=android-twa"
          assert manifest["webManifestUrl"] == "https://lifeosai.pages.dev/manifest.webmanifest"
          assert assetlinks[0]["target"]["package_name"] == manifest["packageId"]
          assert len(assetlinks[0]["target"]["sha256_cert_fingerprints"]) == 1
          print("PAGES_PRODUCTION_CONTRACT=PASS")
          print("RENDER_ORIGIN_NOT_USED_BY_TWA=PASS")
          PY

      - name: Verify signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LOSAI_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LOSAI_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.LOSAI_ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"

      - name: Restore and verify signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LOSAI_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LOSAI_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          actual="$(keytool -exportcert -rfc -alias "$KEY_ALIAS" -keystore "$KEYSTORE_PATH" -storepass:env KEYSTORE_PASSWORD | openssl x509 -noout -fingerprint -sha256 | awk -F= '{print toupper($2)}')"
          expected="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("web/lifeos_voice/.well-known/assetlinks.json").read_text(encoding="utf-8"))
          print(data[0]["target"]["sha256_cert_fingerprints"][0])
          PY
          )"
          test "$actual" = "$expected"
          echo "SIGNING_CERTIFICATE=PASS"

      - name: Install pinned Bubblewrap
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --global @bubblewrap/cli@1.24.1
          rm -rf "$BUBBLEWRAP_ANDROID_SDK" "$HOME/.bubblewrap"
          mkdir -p "$BUBBLEWRAP_ANDROID_SDK" "$HOME/.bubblewrap"
          for entry in "$ANDROID_HOME"/*; do
            [ -e "$entry" ] || continue
            ln -s "$entry" "$BUBBLEWRAP_ANDROID_SDK/$(basename "$entry")"
          done
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          rm -rf "$BUBBLEWRAP_ANDROID_SDK/bin"
          ln -s "$(dirname "$SDKMANAGER")" "$BUBBLEWRAP_ANDROID_SDK/bin"
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path.home().joinpath(".bubblewrap", "config.json").write_text(
              json.dumps({"jdkPath": os.environ["JAVA_HOME"], "androidSdkPath": os.environ["BUBBLEWRAP_ANDROID_SDK"]}) + "\n",
              encoding="utf-8",
          )
          PY
          bubblewrap --version

      - name: Generate TWA project for Pages
        shell: bash
        working-directory: apps/android-twa
        run: |
          set -Eeuo pipefail
          ci_manifest="$PWD/twa-manifest.ci.json"
          python - "$PWD/twa-manifest.json" "$ci_manifest" <<'PY'
          import json, sys
          from pathlib import Path
          source, destination = map(Path, sys.argv[1:])
          manifest = json.loads(source.read_text(encoding="utf-8"))
          if manifest["host"] != "lifeosai.pages.dev" or manifest["startUrl"] != "/chat?source=android-twa":
              raise SystemExit("Unexpected production TWA contract")
          local = "http://127.0.0.1:8765"
          manifest["iconUrl"] = local + "/icons/lifeos-icon-512.png"
          manifest["maskableIconUrl"] = local + "/icons/lifeos-icon-maskable-512.png"
          manifest["webManifestUrl"] = local + "/manifest.webmanifest"
          destination.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          python -m http.server 8765 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/web/lifeos_voice" >/tmp/lifeosai-twa-assets.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true; wait "$server_pid" >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import time, urllib.request
          urls = [
              "http://127.0.0.1:8765/manifest.webmanifest",
              "http://127.0.0.1:8765/icons/lifeos-icon-512.png",
              "http://127.0.0.1:8765/icons/lifeos-icon-maskable-512.png",
          ]
          for attempt in range(30):
              try:
                  for url in urls:
                      with urllib.request.urlopen(url, timeout=2) as response:
                          assert response.status == 200
                  print("LOCAL_TWA_ASSETS=PASS")
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(0.5)
          PY
          export ANDROID_HOME="$BUBBLEWRAP_ANDROID_SDK"
          export ANDROID_SDK_ROOT="$BUBBLEWRAP_ANDROID_SDK"
          bubblewrap update --skipVersionUpgrade --manifest="$ci_manifest"
          kill "$server_pid" >/dev/null 2>&1 || true
          wait "$server_pid" >/dev/null 2>&1 || true
          trap - EXIT
          python - <<'PY'
          from pathlib import Path
          path = Path("app/build.gradle")
          text = path.read_text(encoding="utf-8")
          local = "http://127.0.0.1:8765/manifest.webmanifest"
          production = "https://lifeosai.pages.dev/manifest.webmanifest"
          if text.count(local) != 1:
              raise SystemExit("Generated manifest URL was not found exactly once")
          path.write_text(text.replace(local, production, 1), encoding="utf-8")
          PY
          grep -Fq "hostName: 'lifeosai.pages.dev'" app/build.gradle
          grep -Fq "launchUrl: '/chat?source=android-twa'" app/build.gradle
          grep -Fq "https://lifeosai.pages.dev/manifest.webmanifest" app/build.gradle
          echo "GENERATED_PAGES_TWA=PASS"

      - name: Build signed APK and AAB
        shell: bash
        working-directory: apps/android-twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.LOSAI_ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.LOSAI_ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          export ANDROID_HOME="$BUBBLEWRAP_ANDROID_SDK"
          export ANDROID_SDK_ROOT="$BUBBLEWRAP_ANDROID_SDK"
          bubblewrap build --manifest="$PWD/twa-manifest.ci.json" --signingKeyPath="$KEYSTORE_PATH" --signingKeyAlias="$KEY_ALIAS"
          test -s app-release-signed.apk
          test -s app-release-bundle.aab
          echo "SIGNED_ANDROID_BUILD=PASS"

      - name: Verify APK identity and signature
        shell: bash
        working-directory: apps/android-twa
        run: |
          set -Eeuo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          badging="$($AAPT dump badging app-release-signed.apk)"
          app_id="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          test "$app_id" = "$PACKAGE_ID"
          "$APKSIGNER" verify --verbose --print-certs app-release-signed.apk > signing-report.txt
          sha256sum app-release-signed.apk app-release-bundle.aab > SHA256SUMS
          echo "APK_PACKAGE_ID=$app_id"
          echo "APK_SIGNATURE=PASS"

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: lifeosai-android-pages-v2-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/android-twa/app-release-signed.apk
            apps/android-twa/app-release-bundle.aab
            apps/android-twa/SHA256SUMS
            apps/android-twa/signing-report.txt
            apps/android-twa/twa-manifest.json
            web/lifeos_voice/.well-known/assetlinks.json
