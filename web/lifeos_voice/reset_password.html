<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="canonical" href="https://losai.onrender.com/reset-password">
  <title>Reset LifeOS Password</title>
  <style>
    :root{color-scheme:dark;--gold:#eabe53;--cream:#fff3cf;--muted:rgba(255,247,223,.72)}
    *{box-sizing:border-box}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 20%,#2b210d,#05060a 55%);font-family:Inter,system-ui,sans-serif;color:var(--cream)}
    main{width:min(520px,100%);padding:24px;border:1px solid rgba(234,190,83,.42);border-radius:22px;background:rgba(5,7,12,.9);box-shadow:0 30px 90px #000b}h1{margin:0 0 8px;color:var(--gold)}p{color:var(--muted);line-height:1.55}
    input,button,a{width:100%;min-height:48px;margin-top:10px;border-radius:12px;font:inherit}input{padding:0 13px;border:1px solid rgba(234,190,83,.4);background:#0b0e14;color:#fff}button{border:1px solid #f0ce72;background:linear-gradient(#efc75e,#b87d1d);color:#171005;font-weight:900}a{display:grid;place-items:center;border:1px solid rgba(234,190,83,.4);color:var(--cream);text-decoration:none}#resetMessage[data-kind="error"]{color:#ffabb3}#resetMessage[data-kind="ok"]{color:#9ff0bb}#resetMessage[data-kind="warning"]{color:#ffd78b}[hidden]{display:none!important}
  </style>
<!-- LIFEOS_PASSWORD_VISIBILITY_V1:STYLE_START -->
<style>
.lifeos-password-field {
  display: grid !important;
  grid-template-columns: minmax(0, 1fr) !important;
  width: 100% !important;
  min-width: 0 !important;
}
.lifeos-password-field > input,
.lifeos-password-field > .lifeos-password-toggle {
  grid-area: 1 / 1 !important;
}
.lifeos-password-field > input {
  width: 100% !important;
  min-width: 0 !important;
  padding-inline-end: 3.25rem !important;
}
.lifeos-password-toggle {
  appearance: none !important;
  width: 2.75rem !important;
  min-width: 2.75rem !important;
  max-width: 2.75rem !important;
  min-height: 2.5rem !important;
  margin: 0 0.25rem 0 0 !important;
  padding: 0 !important;
  align-self: center !important;
  justify-self: end !important;
  display: inline-grid !important;
  place-items: center !important;
  border: 0 !important;
  border-radius: 0.65rem !important;
  color: inherit !important;
  background: transparent !important;
  box-shadow: none !important;
  cursor: pointer !important;
  z-index: 2 !important;
}
.lifeos-password-toggle:hover { background: rgba(255,255,255,.08) !important; }
.lifeos-password-toggle:focus-visible {
  outline: 2px solid currentColor !important;
  outline-offset: 2px !important;
}
.lifeos-password-toggle__icon {
  position: relative !important;
  display: inline-block !important;
  line-height: 1 !important;
  font-size: 1.15rem !important;
}
.lifeos-password-toggle[aria-pressed="true"] .lifeos-password-toggle__icon::after {
  content: "";
  position: absolute;
  left: -0.12em;
  right: -0.12em;
  top: 50%;
  border-top: 0.13em solid currentColor;
  transform: rotate(-45deg);
  transform-origin: center;
}
</style>
<!-- LIFEOS_PASSWORD_VISIBILITY_V1:STYLE_END -->
</head>
<body>
  <main>
    <h1>Reset LifeOS password</h1>
    <p id="resetMessage" role="status" aria-live="polite">Verifying the password-reset link…</p>
    <!-- LIFEOS_PASSWORD_VISIBILITY_V1:CONTROL_START -->
    <span class="lifeos-password-field" data-lifeos-password-field="v1">
      <input id="newPassword" type="password" autocomplete="new-password" placeholder="New password" data-lifeos-password-input="v1">
      <button type="button" class="lifeos-password-toggle" data-lifeos-password-toggle="v1" data-lifeos-password-target="newPassword" aria-controls="newPassword" aria-label="Show password" aria-pressed="false"><span class="lifeos-password-toggle__icon" aria-hidden="true">&#128065;</span></button>
    </span>
    <!-- LIFEOS_PASSWORD_VISIBILITY_V1:CONTROL_END -->
    <!-- LIFEOS_PASSWORD_VISIBILITY_V1:CONTROL_START -->
    <span class="lifeos-password-field" data-lifeos-password-field="v1">
      <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm new password" data-lifeos-password-input="v1">
      <button type="button" class="lifeos-password-toggle" data-lifeos-password-toggle="v1" data-lifeos-password-target="confirmPassword" aria-controls="confirmPassword" aria-label="Show password" aria-pressed="false"><span class="lifeos-password-toggle__icon" aria-hidden="true">&#128065;</span></button>
    </span>
    <!-- LIFEOS_PASSWORD_VISIBILITY_V1:CONTROL_END -->
    <button id="resetPassword" type="button">Update password</button>
    <a id="returnToLifeOS" href="/chat" hidden>Return to LifeOS</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.3/dist/umd/supabase.js" integrity="sha384-sihuiVHG7vyEIuePVbLI4QpHu1dbhCZe4Zqp0FuqnFeEnyIhF3koyXoBZyfbFsYs" crossorigin="anonymous"></script>
  <script src="/assets/lifeos_account_v1.js?v=2.1.0"></script>
  <script src="/assets/lifeos_reset_password_v1.js?v=2.1.0"></script>
<!-- LIFEOS_PASSWORD_VISIBILITY_V1:SCRIPT_START -->
<script>
(() => {
  "use strict";
  const selector = 'button[data-lifeos-password-toggle="v1"]';
  document.addEventListener("click", (event) => {
    const target = event.target;
    if (!(target instanceof Element)) return;
    const button = target.closest(selector);
    if (!(button instanceof HTMLButtonElement)) return;
    const inputId = button.dataset.lifeosPasswordTarget || "";
    const input = inputId ? document.getElementById(inputId) : null;
    if (!(input instanceof HTMLInputElement)) return;
    if (input.dataset.lifeosPasswordInput !== "v1") return;
    const reveal = input.type === "password";
    if (!reveal && input.type !== "text") return;
    input.type = reveal ? "text" : "password";
    button.setAttribute("aria-pressed", reveal ? "true" : "false");
    button.setAttribute("aria-label", reveal ? "Hide password" : "Show password");
  });
})();
</script>
<!-- LIFEOS_PASSWORD_VISIBILITY_V1:SCRIPT_END -->
</body>
</html>
